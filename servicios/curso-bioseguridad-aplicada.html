<body>
    <div class="app">

            <a class="support" target="_blank"

        <div id="progress" class="progress" hidden>
            <div class="progress-top"><b id="progress-step"></b><span id="progress-name"></span></div>
            <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        </div>

        <main id="main"></main>
    </div>

    <script>
        // Caneca de residuos con tapa, apoyada en la línea `y` y centrada en `cx`
        function caneca(cx, y, fill, stroke, letra) {
            return `
              <path d="M${cx - 30} ${y - 78} L${cx - 24} ${y} H${cx + 24} L${cx + 30} ${y - 78} Z" fill="${fill}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/>
              <rect x="${cx - 35}" y="${y - 90}" width="70" height="12" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
              <rect x="${cx - 9}" y="${y - 96}" width="18" height="6" rx="3" fill="${stroke}"/>
              <circle cx="${cx}" cy="${y - 38}" r="15" fill="#fff" stroke="${stroke}" stroke-width="2"/>
              <text x="${cx}" y="${y - 32}" text-anchor="middle" font-size="16" font-weight="900" fill="#334155">${letra}</text>`;
        }

        // Jeringa horizontal; la aguja apunta a la izquierda desde (x, y)
        function jeringa(x, y) {
            return `
              <path d="M${x} ${y} H${x + 34}" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
              <rect x="${x + 34}" y="${y - 6}" width="10" height="12" rx="2" fill="#94a3b8"/>
              <rect x="${x + 44}" y="${y - 12}" width="74" height="24" rx="4" fill="#eff6ff" stroke="#0158AD" stroke-width="2.5"/>
              <rect x="${x + 48}" y="${y - 8}" width="34" height="16" rx="2" fill="#fca5a5"/>
              ${[0, 1, 2, 3].map(i => `<path d="M${x + 60 + i * 14} ${y - 12} V${y - 5}" stroke="#0158AD" stroke-width="1.5"/>`).join('')}
              <path d="M${x + 118} ${y - 16} V${y + 16} M${x + 118} ${y} H${x + 146} M${x + 146} ${y - 12} V${y + 12}" stroke="#0158AD" stroke-width="3" stroke-linecap="round"/>`;
        }

        // Todo lo que cambia entre cursos vive aquí; la lógica está en flujo/flujo.js
        window.CURSO = {
            storageKey: 'certitec_flujo_bioseguridad_v1',
            // `pagina` es el campo por el que n8n enruta los avisos de Telegram
            pagina:   'Curso Bioseguridad Aplicada',
            // Deben coincidir con los que envía la CAPI del servidor (deduplicación en Meta)
            slug:     'bioseguridad',
            nombre:   'Bioseguridad',
            titulo:   'Bioseguridad Aplicada',
            producto: 'Diplomado en Bioseguridad Aplicada',
            entrega:  'tu diploma y tu certificado',
            aval:     'Diploma + Certificado · 40 horas',
            portada:  { src: 'flujo/img/bioseguridad-portada.jpg', alt: 'Profesional de la salud con tapabocas poniéndose guantes en el pasillo de un hospital' },
            precio:   34900,
            minutos:  4,
            minAprobar: 0.75,
            whatsapp: '573107941580',
            // Sin link de pago por ahora: el pago se coordina por WhatsApp. Cuando haya un link
            // de Wompi de 34.900 propio del curso, va en `nequiUrl` con `valorEnLink: true`.
            // Algunas preguntas traen un `svg` ilustrativo (clases fx-* = animaciones de flujo.css).
            // Los gráficos no delatan la respuesta: la opción correcta se deduce del conocimiento.
            preguntas: [
                { q: "El principio que establece tomar precauciones con TODAS las personas por igual, sin importar si se sabe que tienen una infección, se llama:",
                  options: ["Barrera de protección", "Universalidad", "Aislamiento selectivo"], a: 1 },

                { q: "Una gasa con sangre de un paciente debe ir en la caneca de:",
                  options: ["La caneca A (roja)", "La caneca B (blanca)", "La caneca C (negra)"], a: 0,
                  svg: `<svg viewBox="0 0 320 168" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-label="Una gasa manchada de sangre sobre tres canecas: A roja, B blanca y C negra">
                    <path d="M14 160 H306" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <g class="fx-drop" style="--d:.05s">${caneca(70, 158, '#ef4444', '#991b1b', 'A')}</g>
                    <g class="fx-drop" style="--d:.17s">${caneca(160, 158, '#f8fafc', '#64748b', 'B')}</g>
                    <g class="fx-drop" style="--d:.29s">${caneca(250, 158, '#334155', '#0f172a', 'C')}</g>
                    <g class="fx-bob">
                      <rect x="134" y="6" width="52" height="36" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
                      <path d="M140 16 H180 M140 24 H180 M140 32 H180" stroke="#e2e8f0" stroke-width="2"/>
                      <path d="M153 18 Q160 10 167 20 Q172 30 160 34 Q148 30 153 18 Z" fill="#dc2626" opacity=".85"/>
                    </g>
                  </svg>` },

                { q: "Las agujas, cuchillas y demás elementos cortopunzantes usados se desechan OBLIGATORIAMENTE en:",
                  options: ["La bolsa roja", "El guardián de seguridad (recipiente rígido)", "Una bolsa negra doble"], a: 1,
                  svg: `<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-label="Una jeringa usada con la aguja descubierta y un signo de pregunta: ¿dónde se desecha?">
                    <g class="fx-slide">${jeringa(40, 60)}</g>
                    <circle class="fx-pulse" style="--d:.3s" cx="38" cy="60" r="5" fill="#dc2626"/>
                    <g class="fx-pop" style="--d:.6s">
                      <circle cx="262" cy="60" r="30" fill="#dbeafe" stroke="#0158AD" stroke-width="2.5"/>
                      <text x="262" y="71" text-anchor="middle" font-size="32" font-weight="900" fill="#0158AD">?</text>
                    </g>
                  </svg>` },

                { q: "Después de aplicar una inyección, la aguja se debe:",
                  options: ["Volver a tapar con su capuchón usando las dos manos", "Desechar de inmediato en el guardián, sin volver a taparla", "Doblar y botar en la caneca de residuos comunes"], a: 1 },

                { q: "¿Cuál es el objetivo de la esterilización?",
                  options: ["Quitar la suciedad visible", "Eliminar la mayoría de bacterias", "Destruir TODA forma de vida microbiana, incluidas las esporas"], a: 2 },

                { q: "Antes de desinfectar o esterilizar un objeto, el PRIMER paso indispensable es:",
                  options: ["Limpiarlo con agua y jabón para retirar la materia orgánica", "Secarlo con aire caliente", "Rociarlo con alcohol al 70%"], a: 0 },

                { q: "¿La desinfección garantiza que se eliminen las esporas bacterianas?",
                  options: ["Sí, siempre las elimina", "No necesariamente: para eso está la esterilización", "Solo si se hace dos veces"], a: 1 },

                { q: "Según la OMS, ¿cuánto debe durar un lavado de manos completo con agua y jabón?",
                  options: ["Entre 5 y 10 segundos", "Entre 40 y 60 segundos", "Lo importante es el jabón, no el tiempo"], a: 1,
                  svg: `<svg viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-label="Un lavamanos con el grifo abierto, burbujas de jabón y un cronómetro">
                    <g class="fx-fade">
                      <path d="M30 96 H190 Q190 128 160 128 H60 Q30 128 30 96 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
                      <path d="M104 96 V40 Q104 28 116 28 H142 V40" stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                    <path class="fx-drip" d="M142 46 V88" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
                    ${[[70, 84, 9], [88, 70, 6], [178, 76, 8], [160, 62, 5], [62, 64, 5]].map(([x, y, r], i) => `<circle class="fx-pulse" style="--d:${(i * 0.18).toFixed(2)}s" cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#93c5fd" stroke-width="2"/>`).join('')}
                    <g class="fx-pop" style="--d:.4s">
                      <rect x="242" y="20" width="12" height="10" rx="2" fill="#0158AD"/>
                      <circle cx="248" cy="74" r="44" fill="#fff" stroke="#0158AD" stroke-width="4"/>
                      ${[...Array(12)].map((_, i) => { const a = i * 30 * Math.PI / 180; return `<path d="M${(248 + 36 * Math.sin(a)).toFixed(1)} ${(74 - 36 * Math.cos(a)).toFixed(1)} L${(248 + 40 * Math.sin(a)).toFixed(1)} ${(74 - 40 * Math.cos(a)).toFixed(1)}" stroke="#94a3b8" stroke-width="2"/>`; }).join('')}
                      <path class="fx-pulse" d="M248 74 L248 42" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
                      <circle cx="248" cy="74" r="4" fill="#334155"/>
                    </g>
                  </svg>` },

                { q: "¿Qué elemento de protección personal (EPP) protege las vías respiratorias contra aerosoles y salpicaduras?",
                  options: ["Los guantes", "El gorro desechable", "La mascarilla o tapabocas"], a: 2 },

                { q: "Al quitarse el equipo de protección después de atender a un paciente, ¿qué se retira primero?",
                  options: ["Los guantes, porque son lo más contaminado", "El tapabocas", "Da igual el orden"], a: 0,
                  svg: `<svg viewBox="0 0 320 132" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-label="Cuatro elementos de protección personal: guantes, bata, tapabocas y gafas">
                    <text x="160" y="16" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0158AD" letter-spacing="0.8">¿EN QUÉ ORDEN SE RETIRAN?</text>
                    <g class="fx-drop" style="--d:.05s">
                      <rect x="8" y="30" width="70" height="92" rx="12" fill="#f1f5f9"/>
                      <path d="M30 108 V70 Q30 62 36 62 V48 Q36 44 40 44 Q44 44 44 48 V60 V44 Q44 40 48 40 Q52 40 52 44 V60 V46 Q52 42 56 42 Q60 42 60 46 V80 L64 72 Q68 68 71 72 L62 96 V108 Z" fill="#93c5fd" stroke="#0158AD" stroke-width="2" stroke-linejoin="round"/>
                    </g>
                    <g class="fx-drop" style="--d:.17s">
                      <rect x="86" y="30" width="70" height="92" rx="12" fill="#f1f5f9"/>
                      <path d="M106 44 L114 40 Q121 48 128 40 L136 44 L146 62 L138 66 L136 58 V112 H106 V58 L104 66 L96 62 Z" fill="#a7f3d0" stroke="#047857" stroke-width="2" stroke-linejoin="round"/>
                    </g>
                    <g class="fx-drop" style="--d:.29s">
                      <rect x="164" y="30" width="70" height="92" rx="12" fill="#f1f5f9"/>
                      <path d="M178 66 Q199 58 220 66 V86 Q199 98 178 86 Z" fill="#fff" stroke="#64748b" stroke-width="2.2" stroke-linejoin="round"/>
                      <path d="M182 74 Q199 69 216 74 M182 81 Q199 76 216 81" stroke="#cbd5e1" stroke-width="1.6" fill="none"/>
                      <path d="M178 68 Q170 62 172 54 M220 68 Q228 62 226 54 M178 84 Q170 88 172 96 M220 84 Q228 88 226 96" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
                    </g>
                    <g class="fx-drop" style="--d:.41s">
                      <rect x="242" y="30" width="70" height="92" rx="12" fill="#f1f5f9"/>
                      <path d="M252 66 H302 V80 Q302 88 294 88 H284 Q280 88 278 82 Q277 78 276 82 Q274 88 270 88 H260 Q252 88 252 80 Z" fill="#dbeafe" stroke="#0158AD" stroke-width="2.2" stroke-linejoin="round"/>
                      <path d="M252 70 L246 66 M302 70 L308 66" stroke="#0158AD" stroke-width="2.2" stroke-linecap="round"/>
                    </g>
                  </svg>` },

                { q: "Te pinchas por accidente con una aguja usada. ¿Qué debes hacer?",
                  options: ["Seguir trabajando y no decirle a nadie", "Lavar la zona con agua y jabón y reportarlo de inmediato como accidente de trabajo", "Chupar la herida para sacar la sangre"], a: 1,
                  svg: `<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-label="Un dedo con una gota de sangre junto a una jeringa y un aviso de alerta">
                    <g class="fx-slide">${jeringa(150, 72)}</g>
                    <g class="fx-fade">
                      <path d="M20 120 V80 Q20 60 40 60 H112 Q130 60 130 76 Q130 92 112 92 H70 V120 Z" fill="#e8b48a" stroke="#b9825a" stroke-width="2.5" stroke-linejoin="round"/>
                      <path d="M100 66 Q118 66 120 76" stroke="#b9825a" stroke-width="2" fill="none"/>
                    </g>
                    <path class="fx-pulse" style="--d:.4s" d="M134 58 Q140 66 140 70 A6 6 0 0 1 128 70 Q128 66 134 58 Z" fill="#dc2626"/>
                    <g class="fx-pop" style="--d:.7s">
                      <path d="M258 8 L284 52 H232 Z" fill="#FFCD57" stroke="#d48f00" stroke-width="2.5" stroke-linejoin="round"/>
                      <text x="258" y="46" text-anchor="middle" font-size="22" font-weight="900" fill="#334155">!</text>
                    </g>
                  </svg>` },

                { q: "Las servilletas y empaques sucios que NO se pueden reciclar (residuos no aprovechables) van en la bolsa de color:",
                  options: ["Roja", "Negra", "Blanca"], a: 1 }
            ]
        };
    </script>
