        // Personas de los gráficos del examen: busto apoyado en la línea `y`, centrado en `cx`.
        // El asesor lleva diadema y camisa azul; el cliente, camisa gris.
        function persona(cx, y, { asesor = false, boca = 'neutra', mirada = 0 } = {}) {
            const piel = asesor ? '#e8b48a' : '#c68b63';
            const hy = y - 68;          // centro de la cabeza
            const fx = cx + mirada;     // centro de la cara (mirada ≠ 0: mira hacia un lado)
            const bocas = {
                neutra: `M${fx - 5} ${hy + 9} H${fx + 5}`,
                enojo:  `M${fx - 6} ${hy + 11} Q${fx} ${hy + 6} ${fx + 6} ${hy + 11}`
            };
            return `
              <path d="M${cx - 30} ${y} V${y - 30} Q${cx - 30} ${y - 46} ${cx - 14} ${y - 46} H${cx + 14} Q${cx + 30} ${y - 46} ${cx + 30} ${y - 30} V${y} Z" fill="${asesor ? '#0158AD' : '#64748b'}"/>

              ${boca === 'enojo' ? `<path d="M${fx - 10} ${hy - 7} L${fx - 3} ${hy - 4} M${fx + 10} ${hy - 7} L${fx + 3} ${hy - 4}" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>` : ''}

              ${asesor ? `
              <path d="M${cx - 19} ${hy} A19 19 0 0 1 ${cx + 19} ${hy}" stroke="#334155" stroke-width="3.5" fill="none"/>
              <rect x="${cx - 23}" y="${hy - 6}" width="7" height="13" rx="3" fill="#334155"/><rect x="${cx + 16}" y="${hy - 6}" width="7" height="13" rx="3" fill="#334155"/>

        }

        // Globo de diálogo con la cola hacia abajo en la x `cola`
        function globo(x, y, w, h, cola, fill = '#fff') {
            const b = y + h;
            return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${fill}" stroke="#94a3b8" stroke-width="2"/>

        }

        // Puntos de una estrella de 5 puntas centrada en (x, y)
        function estrella(x, y, r) {
            return [...Array(10)].map((_, i) => {
                const a = (i * 36 - 90) * Math.PI / 180, rr = i % 2 ? r * 0.45 : r;
                return (x + rr * Math.cos(a)).toFixed(1) + ',' + (y + rr * Math.sin(a)).toFixed(1);
            }).join(' ');
        }
